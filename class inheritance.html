<html>

<body>
    <h2>JavaScript Class Inheritance</h2>
    <p>Use the "extends" keyword to inherits all methods and properties from another class.</p>
    <p>Use the "super" keyword to call the parent class's constructor function.</p>
    <p id="details"></p>
    <script>
        class car {
            constructor(brand) {
                this.carName = brand;
            }
            present() {
                return 'I have a ' + this.carName;
            }
        }

        class Model extends car {
            constructor(brand, mod) {
                super(brand);
                this.model = mod;
            }
            show() {
                return this.present() + ', it is a ' + this.model;
            }
        }

        let myCar = new Model("Mustang", "Ford");
        document.getElementById("details").innerHTML = myCar.show();
    </script>
</body>

</html>
