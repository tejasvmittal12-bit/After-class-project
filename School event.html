<html>

<head>
    <title>My School Event.</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: aliceblue;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #ff5a43;
        }

        button {
            background: #ff5a43;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            margin: 5px;
        }

        div {
            border: 1px solid #ff5a43;
            width: 280px;
            padding: 8px 12px;
            margin: 6px auto;
            text-align: left;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <h1>My School Event.</h1>
    <button onclick="saveEvent()">Save Event</button>
    <button onclick="startEvent()">Start Event</button>

    <div>JSON Text: <span id="json_text"></span></div>
    <div>Loaded Item: <span id="loaded_item"></span></div>
    <div>Loaded Price: <span id="loaded_price"></span></div>
    <div>Status: <span id="status"></span></div>
    <div>Result: <span id="result"></span></div>

    <script>
        let event = {
            name: "Science Fair",
            date: "2023-10-15",
            location: "Main Hall"
        };

        function saveEvent() {
            let jsonText = JSON.stringify(event);
            let loadedEvent = JSON.parse(jsonText);

            document.getElementById("json_text").innerHTML = jsonText;
            document.getElementById("loaded_item").innerHTML = loadedEvent.name;
            document.getElementById("loaded_price").innerHTML = loadedEvent.date;
        }

        function delay(ms) {
            return new Promise(function (resolve) {
                setTimeout(resolve, ms);
            });
        }

        async function startEvent() {
            document.getElementById("result").innerHTML = "";

            document.getElementById("status").innerHTML = "Event scheduled...";
            setTimeout(function () {
                document.getElementById("status").innerHTML = "Preparing for the event...";
            }, 1000);

            await delay(3000);
            document.getElementById("status").innerHTML = "Event is starting now!";

</body>

</html>
