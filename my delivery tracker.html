<html>

<head>
    <title>My Delivery Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: aliceblue;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #ff5a43;
        }

        button {
            background: #ff5a43;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            margin: 5px;
        }

        div {
            border: 1px solid #ff5a43;
            width: 280px;
            padding: 8px 12px;
            margin: 6px auto;
            text-align: left;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <h1>My Delivery Tracker</h1>
    <button onclick="saveOrder()">Save Order</button>
    <button onclick="startDelivery()">Start Delivery</button>

    <div>JSON Text: <span id="json_text"></span></div>
    <div>Loaded Item: <span id="loaded_item"></span></div>
    <div>Loaded Price: <span id="loaded_price"></span></div>
    <div>Status: <span id="status"></span></div>
    <div>Result: <span id="result"></span></div>

    <script>
        let order = {
            item: "Pizza",
            price: 5,
            Shop: "My snack shop"
        };

        function saveOrder() {
            let jsonText = JSON.stringify(order);
            let loadedOrder = JSON.parse(jsonText);

            document.getElementById("json_text").innerHTML = jsonText;
            document.getElementById("loaded_item").innerHTML = loadedOrder.item;
            document.getElementById("loaded_price").innerHTML = "$" + loadedOrder.price;
        }

        function delay(ms) {
            return new Promise(function (resolve) {
                setTimeout(resolve, ms);
            });
        }

        async function startDelivery() {
            document.getElementById("result").innerHTML = "";

            document.getElementById("status").innerHTML = "Order received...";
            setTimeout(function () {
                document.getElementById("status").innerHTML = "Kitchen Is Preparing...";
            }, 1000);

            await delay(3000);
            document.getElementById("status").innerHTML = "Out For Delivery...";

            await delay(2000);
            document.getElementById("status").innerHTML = "Your Order Has Arrived!";
        }

    </script>
</body>

</html>
