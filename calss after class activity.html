<html>

<body>
    <p id="details"></p>
    <script>
        class car {
            constructor(brand) {
                this.carName = brand;
            }
            present() {
                return 'I have a ' + this.carName;
            }
        }

        class Model extends car {
            constructor(brand, mod) {
                super(brand);
                this.model = mod;
            }
            show() {
                return this.present() + ', it is a ' + this.model;
            }
        }

        let myCar = new Model("jesko absoult", "koegnigsegg");
        document.getElementById("details").innerHTML = myCar.show();
    </script>
</body>

</html>
