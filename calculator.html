<!DOCTYPE html>
<html lang="en">

<body>

    <p id="result"></p>
    <script>
        var num1 = 5;
        var num2 = 6;
        var sum = num1 + num2;
        document.getElementById("result").innerHTML = "The sum is " + sum;

        var num1 = 5;
        var num2 = 6;
        var difference = num1 - num2;
        document.getElementById("result").innerHTML += "<br>The difference is " + difference;

        var num1 = 5;
        var num2 = 6;
        var product = num1 * num2;
        document.getElementById("result").innerHTML += "<br>The product is " + product;

        var num1 = 5;
        var num2 = 6;
        var quotient = num1 / num2;
        document.getElementById("result").innerHTML += "<br>The quotient is " + quotient;

    </script>
</body>

</html>
